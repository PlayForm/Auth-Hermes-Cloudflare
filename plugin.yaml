name: auth-hermes-cloudflare
version: 0.0.6
description: "Auth Cloudflare Workers AI model-provider plugin - direct OpenAI-compatible access to Cloudflare-hosted Workers AI models with account-aware catalog discovery. DeepSeek V4 Flash is the development default; GLM-5.3 Flash is experimental."
kind: model-provider
min_hermes_version: "0.16.0"
author: PlayForm
homepage: https://github.com/PlayForm/Cloudflare
repository: https://github.com/PlayForm/Hermes-Cloudflare
license: CC0-1.0
requires_hooks: true
provides_hooks:
  - transform_api_error_classification
  - on_session_start
env_vars:
  - CLOUDFLARE_API_TOKEN
  - CLOUDFLARE_ACCOUNT_ID
  - CLOUDFLARE_BASE_URL
